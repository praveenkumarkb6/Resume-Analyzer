https://resume-analyzer-tz24.onrender.com

## GitHub Repository

https://github.com/praveenkumarkb6/Resume-Analyzer

## Technologies Used

- React
- Vite
- Python
- Flask
- PDF processing
- REST API
- Render
- GitHub Pages
- GitHub Actions

## Main Features

- Upload resume PDF
- Enter job description
- Extract resume content
- Analyze required skills
- Compare resume skills with job skills
- Display analysis results
- Resume structure analysis
- Skills analysis
- Job description skill comparison
- Recommendations

## Deployment

The frontend is deployed using:

- GitHub Pages
- Render

The backend API is deployed using:

- Render

GitHub Actions is used to automatically build and deploy the frontend to GitHub Pages whenever changes are pushed to the `main` branch.